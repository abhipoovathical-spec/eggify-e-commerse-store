{% extends 'base.html' %}

{% block title %}Server Error | EGGIFY{% endblock %}

{% block content %}
<div class="py-20 text-center">
    <div class="w-20 h-20 rounded-3xl bg-rose-100 text-rose-600 flex items-center justify-center mx-auto text-4xl mb-4">
        <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h1 class="text-4xl font-black font-outfit text-gray-900 mb-2">500 - Unexpected Error</h1>
    <p class="text-sm text-gray-500 max-w-sm mx-auto mb-6">Our system encountered an issue. Please try again or reach out to EGGIFY support.</p>
    <a href="{{ url_for('customer.index') }}" class="inline-flex items-center space-x-2 px-6 py-3 bg-egg-dark text-white rounded-xl text-xs font-bold hover:bg-gray-800 transition">
        <span>Back to Homepage</span>
    </a>
</div>
{% endblock %}
