{% extends 'base.html' %}

{% block title %}Track Your Order | EGGIFY{% endblock %}

{% block content %}
<div class="py-12 sm:py-16 bg-gray-50">
    <div class="max-w-md mx-auto px-4 sm:px-6">

        <div class="text-center mb-8 space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-amber-400/20 text-amber-600 flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <h1 class="text-2xl font-black font-outfit text-gray-900">Track Your Fresh Egg Order</h1>
            <p class="text-xs text-gray-600">Enter your Order ID and registered mobile number to check real-time fulfillment status.</p>
        </div>

        <div class="bg-white rounded-3xl border border-gray-200 p-6 sm:p-8 shadow-xl">
            <form action="{{ url_for('customer.track_lookup') }}" method="POST" class="space-y-4">
                <div>
                    <label for="order_code" class="block text-xs font-bold text-gray-700 mb-1">
                        Order ID <span class="text-rose-500">*</span>
                    </label>
                    <input type="text" name="order_code" id="order_code" placeholder="e.g. EGG-261120-101" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-2.5 text-sm font-mono font-semibold uppercase text-gray-900 focus:ring-2 focus:ring-amber-500 focus:outline-none" required>
                </div>

                <div>
                    <label for="phone" class="block text-xs font-bold text-gray-700 mb-1">
                        Registered Mobile Number <span class="text-rose-500">*</span>
                    </label>
                    <div class="relative flex items-center">
                        <span class="absolute left-3 text-xs font-bold text-gray-400">+91</span>
                        <input type="tel" name="phone" id="phone" placeholder="9876543210" pattern="[0-9]{10}" maxlength="10" class="w-full bg-gray-50 border border-gray-300 rounded-xl pl-12 pr-4 py-2.5 text-sm font-semibold text-gray-900 focus:ring-2 focus:ring-amber-500 focus:outline-none" required>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-egg-dark font-extrabold rounded-xl shadow-lg shadow-amber-500/20 text-sm transition">
                        <i class="fa-solid fa-truck-fast mr-1.5"></i> Check Live Status
                    </button>
                </div>
            </form>

            <div class="mt-6 pt-5 border-t border-gray-200 text-center">
                <a href="{{ url_for('customer.order_page') }}" class="text-xs text-amber-600 hover:underline font-semibold">
                    ← Place a New Order
                </a>
            </div>
        </div>

    </div>
</div>
{% endblock %}
