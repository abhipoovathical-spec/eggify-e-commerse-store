{% extends 'base.html' %}

{% block title %}Page Not Found | EGGIFY{% endblock %}

{% block content %}
<div class="py-20 text-center">
    <div class="w-20 h-20 rounded-3xl bg-amber-100 text-amber-600 flex items-center justify-center mx-auto text-4xl mb-4">
        <i class="fa-solid fa-egg"></i>
    </div>
    <h1 class="text-4xl font-black font-outfit text-gray-900 mb-2">404 - Page Not Found</h1>
    <p class="text-sm text-gray-500 max-w-sm mx-auto mb-6">The page or gym order link you were looking for doesn't exist.</p>
    <a href="{{ url_for('customer.index') }}" class="inline-flex items-center space-x-2 px-6 py-3 bg-egg-dark text-white rounded-xl text-xs font-bold hover:bg-gray-800 transition">
        <span>Back to Homepage</span>
    </a>
</div>
{% endblock %}
